<zeo>
  address {zeo_address}
  read-only false
  invalidation-queue-size 100
  pid-filename {pid_file}
</zeo>

<blobstorage 1>
  blob-dir {blob_dir}
  <filestorage>
    path {file_storage}
  </filestorage>
</blobstorage>

%import tempstorage
<temporarystorage temp>
  name temporary storage for sessioning
</temporarystorage>

<eventlog>
  level info
  <logfile>
    path {event_log}
    format %(asctime)s %(message)s
  </logfile>
</eventlog>
